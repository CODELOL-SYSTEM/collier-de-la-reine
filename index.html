<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Le collier</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:Georgia,'Palatino Linotype',serif;color:#e8dcc0}
#stage{position:fixed;inset:0;touch-action:none}
#stage canvas{display:block;pointer-events:none}
.ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;z-index:7;font-size:clamp(20px,4vw,36px);text-align:center}
#load{background:#000}
#start{display:none;background:radial-gradient(ellipse at 50% 40%,rgba(10,16,40,.35),rgba(0,0,0,.88) 75%)}
#start .t{letter-spacing:.35em;text-transform:uppercase;font-size:.55em;color:#b89b5e;opacity:.9}
#start h1{margin:0;font-weight:400;font-size:2.4em;letter-spacing:.12em;background:linear-gradient(180deg,#fff3c4,#d9ae55 55%,#8a6422);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 14px rgba(0,0,0,.9))}
#fade{position:fixed;inset:0;background:#000;opacity:1;pointer-events:none;z-index:4}
#bars i{position:fixed;left:0;right:0;height:6vh;background:#000;z-index:5;pointer-events:none}
#bars i:first-child{top:0}#bars i:last-child{bottom:0}
/* ---------- bouton 3D ---------- */
.scene3d{perspective:700px}
#go{position:relative;font:inherit;font-size:.62em;letter-spacing:.28em;text-transform:uppercase;color:#2a1a04;border:0;cursor:pointer;padding:1.05em 3em;border-radius:999px;
 background:linear-gradient(180deg,#fff0b8 0%,#f0c968 22%,#c8922e 58%,#e8b850 100%);
 box-shadow:inset 0 2px 1px rgba(255,255,255,.85),inset 0 -5px 8px rgba(110,64,8,.55),0 1px 0 #8a5c14,0 2px 0 #7a4e10,0 3px 0 #6a420c,0 4px 0 #5a360a,0 5px 0 #4a2c08,0 14px 22px rgba(0,0,0,.75),0 0 40px rgba(240,190,90,.28);
 text-shadow:0 1px 0 rgba(255,235,170,.9);transform-style:preserve-3d;transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .15s ease-out,box-shadow .2s,filter .2s;overflow:hidden}
#go::before{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.65) 50%,transparent 65%);transform:translateX(-130%);animation:shine 3.2s ease-in-out infinite}
@keyframes shine{0%,55%{transform:translateX(-130%)}100%{transform:translateX(130%)}}
#go:hover{filter:brightness(1.08);box-shadow:inset 0 2px 1px rgba(255,255,255,.9),inset 0 -5px 8px rgba(110,64,8,.55),0 1px 0 #8a5c14,0 2px 0 #7a4e10,0 3px 0 #6a420c,0 4px 0 #5a360a,0 5px 0 #4a2c08,0 18px 28px rgba(0,0,0,.8),0 0 60px rgba(255,205,110,.5)}
#go:active{transform:translateY(4px) rotateX(0) rotateY(0);box-shadow:inset 0 2px 1px rgba(255,255,255,.6),inset 0 -3px 6px rgba(110,64,8,.6),0 1px 0 #6a420c,0 4px 8px rgba(0,0,0,.8)}
#site{display:none;position:fixed;inset:0;background:radial-gradient(ellipse at center,#0b0f1e,#000 80%);align-items:center;justify-content:center;text-align:center;padding:24px;box-sizing:border-box;font-size:clamp(20px,4vw,36px);line-height:1.6;color:#e8dcc0;z-index:3;text-shadow:0 2px 14px #000}
#year{position:fixed;top:9%;left:0;right:0;text-align:center;font:clamp(36px,8vw,90px) Georgia,serif;background:linear-gradient(180deg,#fff3c4,#d9ae55 60%,#8a6422);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 10px #000);z-index:6;opacity:0;pointer-events:none;letter-spacing:.1em}
#sub{position:fixed;left:0;right:0;bottom:9%;text-align:center;font:italic clamp(18px,3vw,30px) Georgia,serif;color:#fff;text-shadow:0 2px 6px #000,0 0 14px #000;z-index:6;opacity:0;pointer-events:none;transition:opacity .25s}
</style></head><body>
<div id="stage"></div>
<div id="fade"></div>
<div id="bars"><i></i><i></i></div>
<div id="sub"></div>
<div id="year"></div>
<div class="ov" id="load">Chargement…</div>
<div class="ov" id="start">
  <div class="t">Une cinématique</div><h1>Le collier</h1>
  <div class="t">🔊 Mettez du son — casque conseillé</div>
  <div class="scene3d"><button id="go">Commencer</button></div>
</div>
<div id="site">Merci d'avoir regardé cette courte animation,<br>vous pouvez fermer la page.</div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script>
const g=document.getElementById('go');
g.addEventListener('pointermove',e=>{const r=g.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;g.style.setProperty('--ry',x*22+'deg');g.style.setProperty('--rx',-y*22+'deg')});
g.addEventListener('pointerleave',()=>{g.style.setProperty('--rx','0deg');g.style.setProperty('--ry','0deg')});
</script>
<script type="module" src="app.js"></script>
</body></html>
